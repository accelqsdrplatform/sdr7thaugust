name: db-migrate

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Verify row counts (dynamic, all public tables + auth.users)
        run: |
          echo "=== SOURCE ==="
          psql "${{ secrets.SOURCE_DB_URL }}" -c "DO \$\$ DECLARE r record; cnt bigint; BEGIN FOR r IN SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename LOOP EXECUTE format('SELECT count(*) FROM public.%I', r.tablename) INTO cnt; RAISE NOTICE '%: %', r.tablename, cnt; END LOOP; EXECUTE 'SELECT count(*) FROM auth.users' INTO cnt; RAISE NOTICE 'auth.users: %', cnt; END \$\$;"
          echo "=== DEST ==="
          psql "${{ secrets.DEST_DB_URL }}" -c "DO \$\$ DECLARE r record; cnt bigint; BEGIN FOR r IN SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename LOOP EXECUTE format('SELECT count(*) FROM public.%I', r.tablename) INTO cnt; RAISE NOTICE '%: %', r.tablename, cnt; END LOOP; EXECUTE 'SELECT count(*) FROM auth.users' INTO cnt; RAISE NOTICE 'auth.users: %', cnt; END \$\$;"
