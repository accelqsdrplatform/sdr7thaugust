name: db-migrate

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Dump roles (source)
        run: npx -y supabase db dump --db-url "${{ secrets.SOURCE_DB_URL }}" -f roles.sql --role-only

      - name: Dump schema (source)
        run: npx -y supabase db dump --db-url "${{ secrets.SOURCE_DB_URL }}" -f schema.sql

      - name: Dump data (source, public+auth only)
        run: npx -y supabase db dump --db-url "${{ secrets.SOURCE_DB_URL }}" -f data.sql --data-only --use-copy --schema public,auth

      - name: Show dump files
        run: ls -la *.sql && wc -l *.sql

      - name: Restore into destination
        run: |
          psql --single-transaction --variable ON_ERROR_STOP=1 \
            --file roles.sql --file schema.sql \
            --command "SET session_replication_role = replica" \
            --file data.sql \
            --dbname "${{ secrets.DEST_DB_URL }}"

      - name: Verify row counts
        run: |
          echo "=== SOURCE ==="
          psql "${{ secrets.SOURCE_DB_URL }}" -c "select 'contacts' t, count(*) from contacts union all select 'accounts', count(*) from accounts union all select 'emails', count(*) from emails union all select 'profiles', count(*) from profiles union all select 'email_prompts', count(*) from email_prompts union all select 'email_responses', count(*) from email_responses union all select 'auth.users', count(*) from auth.users;"
          echo "=== DEST ==="
          psql "${{ secrets.DEST_DB_URL }}" -c "select 'contacts' t, count(*) from contacts union all select 'accounts', count(*) from accounts union all select 'emails', count(*) from emails union all select 'profiles', count(*) from profiles union all select 'email_prompts', count(*) from email_prompts union all select 'email_responses', count(*) from email_responses union all select 'auth.users', count(*) from auth.users;"
